<?xml version="1.0" encoding="utf-8"?>
<Playbook>
	<Name>TGOS</Name>
	<Username>tehgeii</Username>
	<Title>TGOS v0.1.0</Title>
	<ShortDescription>Tech Gameplay Operating System for Windows 11 Pro</ShortDescription>
	<Description><![CDATA[TGOS turns Windows 11 Pro into a lightweight gaming OS.

This version removes preinstalled apps and turns off telemetry and ads. Services, Defender and Windows Update are not touched.

Versi ini menghapus aplikasi bawaan serta mematikan telemetri dan iklan.]]></Description>
	<Details>Removes preinstalled apps and turns off Windows telemetry, ads and suggestions.</Details>
	<ProgressText><![CDATA[TGOS is creating a restore point, removing preinstalled apps and applying privacy settings.]]></ProgressText>
	<Version>0.1.0</Version>
	<UniqueId>26dd6cef-05e4-4674-a9d5-d0460896ba6a</UniqueId>
	<SupportedBuilds>
		<!-- Windows 11 22H2 -->
		<string>22621</string>
		<!-- Windows 11 23H2 -->
		<string>22631</string>
		<!-- Windows 11 24H2 -->
		<string>26100</string>
		<!-- Windows 11 25H2 -->
		<string>26200</string>
		<!-- Windows 11 26H2 -->
		<string>26300</string>
	</SupportedBuilds>
	<Requirements>
		<Requirement>PluggedIn</Requirement>
		<Requirement>NoPendingUpdates</Requirement>
		<Requirement>NoAntivirus</Requirement>
	</Requirements>
	<Overhaul>true</Overhaul>
	<UseKernelDriver>false</UseKernelDriver>
	<EstimatedMinutes>5</EstimatedMinutes>
	<Website>https://tgopremium.my.id</Website>
	<FeaturePages>
		<CheckboxPage Description="Choose which optional components TGOS removes.">
			<Options>
				<CheckboxOption IsChecked="true">
					<Text>Remove Copilot and Widgets</Text>
					<Name>remove-ai-widgets</Name>
				</CheckboxOption>
				<CheckboxOption IsChecked="false">
					<Text>Remove Xbox app and Game Bar</Text>
					<Name>remove-xbox</Name>
				</CheckboxOption>
			</Options>
		</CheckboxPage>
	</FeaturePages>
</Playbook>
