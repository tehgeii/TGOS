<?xml version="1.0" encoding="utf-8"?>
<Playbook>
	<Name>TGOS</Name>
	<Username>tehgeii</Username>
	<Title>TGOS v1.0.0</Title>
	<ShortDescription>Tech Gameplay Operating System</ShortDescription>
	<Description><![CDATA[Lightweight Windows 11 Pro for gaming: less bloat, less telemetry, more performance.

Windows jadi lebih ringan untuk gaming.]]></Description>
	<Details>Removes preinstalled apps, turns off telemetry and unneeded services, applies gaming performance settings, and can install a browser and game runtimes.</Details>
	<ProgressText><![CDATA[TGOS is creating a restore point, installing the software you chose, removing preinstalled apps, and applying privacy, service and performance settings.]]></ProgressText>
	<Version>1.0.0</Version>
	<UniqueId>26dd6cef-05e4-4674-a9d5-d0460896ba6a</UniqueId>
	<SupportedBuilds>
		<!-- Windows 11 22H2 -->
		<string>22621</string>
		<!-- Windows 11 23H2 -->
		<string>22631</string>
		<!-- Windows 11 24H2 -->
		<string>26100</string>
		<!-- Windows 11 25H2 -->
		<string>26200</string>
		<!-- Windows 11 26H2 -->
		<string>26300</string>
	</SupportedBuilds>
	<Requirements>
		<Requirement>PluggedIn</Requirement>
		<Requirement>NoPendingUpdates</Requirement>
		<Requirement>NoAntivirus</Requirement>
	</Requirements>
	<Overhaul>true</Overhaul>
	<UseKernelDriver>false</UseKernelDriver>
	<EstimatedMinutes>15</EstimatedMinutes>
	<Website>https://tgopremium.my.id</Website>
	<FeaturePages>
		<CheckboxPage Description="Choose which built-in components to remove.">
			<Options>
				<CheckboxOption IsChecked="true">
					<Text>Remove Copilot and Widgets</Text>
					<Name>remove-ai-widgets</Name>
				</CheckboxOption>
				<CheckboxOption IsChecked="true">
					<Text>Remove OneDrive</Text>
					<Name>remove-onedrive</Name>
				</CheckboxOption>
				<CheckboxOption IsChecked="false">
					<Text>Remove Xbox app and Game Bar</Text>
					<Name>remove-xbox</Name>
				</CheckboxOption>
				<CheckboxOption IsChecked="false">
					<Text>Remove Microsoft Store (hard to undo)</Text>
					<Name>remove-store</Name>
				</CheckboxOption>
			</Options>
		</CheckboxPage>
		<RadioImagePage DefaultOption="browser-brave" Description="Choose a browser to install. Needs internet.">
			<Options>
				<RadioImageOption>
					<Text>Brave</Text>
					<Name>browser-brave</Name>
					<FileName>brave</FileName>
					<GradientTopColor>#FB542B</GradientTopColor>
					<GradientBottomColor>#A3300F</GradientBottomColor>
				</RadioImageOption>
				<RadioImageOption>
					<Text>Chrome</Text>
					<Name>browser-chrome</Name>
					<FileName>chrome</FileName>
					<GradientTopColor>#4C8BF5</GradientTopColor>
					<GradientBottomColor>#1A4FA8</GradientBottomColor>
				</RadioImageOption>
				<RadioImageOption>
					<Text>Firefox</Text>
					<Name>browser-firefox</Name>
					<FileName>firefox</FileName>
					<GradientTopColor>#FF8A16</GradientTopColor>
					<GradientBottomColor>#B5007F</GradientBottomColor>
				</RadioImageOption>
				<RadioImageOption None="true" />
			</Options>
		</RadioImagePage>
		<CheckboxPage Description="Extra software. Edge is kept if no other browser gets installed.">
			<Options>
				<CheckboxOption IsChecked="true">
					<Text>Install 7-Zip</Text>
					<Name>install-7zip</Name>
				</CheckboxOption>
				<CheckboxOption IsChecked="true">
					<Text>Install game runtimes (VC++, DirectX)</Text>
					<Name>install-runtimes</Name>
				</CheckboxOption>
				<CheckboxOption IsChecked="false">
					<Text>Remove Microsoft Edge</Text>
					<Name>remove-edge</Name>
				</CheckboxOption>
			</Options>
		</CheckboxPage>
		<CheckboxPage Description="Power options. All can be reversed later in the TGOS Toolbox.">
			<Options>
				<CheckboxOption IsChecked="true">
					<Text>Ultimate Performance plan (not for laptops)</Text>
					<Name>disable-power-saving</Name>
				</CheckboxOption>
				<CheckboxOption IsChecked="true">
					<Text>Disable CPU core parking (not for laptops)</Text>
					<Name>disable-core-parking</Name>
				</CheckboxOption>
				<CheckboxOption IsChecked="true">
					<Text>Disable hibernation and Fast Startup</Text>
					<Name>disable-hibernation</Name>
				</CheckboxOption>
				<CheckboxOption IsChecked="true">
					<Text>Disable search indexing</Text>
					<Name>disable-indexing</Name>
				</CheckboxOption>
			</Options>
		</CheckboxPage>
		<CheckboxPage Description="System options. Trimming services stops printing and network discovery.">
			<Options>
				<CheckboxOption IsChecked="true">
					<Text>Disable Core Isolation (VBS)</Text>
					<Name>disable-vbs</Name>
				</CheckboxOption>
				<CheckboxOption IsChecked="true">
					<Text>Disable animations</Text>
					<Name>disable-animations</Name>
				</CheckboxOption>
				<CheckboxOption IsChecked="false">
					<Text>Trim extra services (printing, discovery)</Text>
					<Name>trim-services</Name>
				</CheckboxOption>
			</Options>
		</CheckboxPage>
		<CheckboxPage Description="Choose how the desktop looks.">
			<Options>
				<CheckboxOption IsChecked="true">
					<Text>Classic right-click menu</Text>
					<Name>classic-context-menu</Name>
				</CheckboxOption>
				<CheckboxOption IsChecked="false">
					<Text>Taskbar icons on the left</Text>
					<Name>taskbar-left</Name>
				</CheckboxOption>
			</Options>
		</CheckboxPage>
		<RadioPage IsRequired="true" DefaultOption="mitigations-default" Description="Disabling CPU mitigations lowers security and mainly helps older CPUs.">
			<Options>
				<RadioOption>
					<Text>Keep default mitigations (recommended)</Text>
					<Name>mitigations-default</Name>
				</RadioOption>
				<RadioOption>
					<Text>Disable CPU mitigations</Text>
					<Name>mitigations-disable</Name>
				</RadioOption>
			</Options>
		</RadioPage>
		<RadioPage IsRequired="true" DefaultOption="updates-manual" Description="Manual: Windows only updates when you check for updates in Settings.">
			<Options>
				<RadioOption>
					<Text>Manual Windows updates</Text>
					<Name>updates-manual</Name>
				</RadioOption>
				<RadioOption>
					<Text>Automatic Windows updates (default)</Text>
					<Name>updates-default</Name>
				</RadioOption>
			</Options>
		</RadioPage>
	</FeaturePages>
</Playbook>
