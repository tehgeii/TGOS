<?xml version="1.0" encoding="utf-8"?>
<Playbook>
	<Name>TGOS</Name>
	<Username>tehgeii</Username>
	<Title>TGOS v0.9.0</Title>
	<ShortDescription>Tech Gameplay Operating System for Windows 11 Pro</ShortDescription>
	<Description><![CDATA[TGOS turns Windows 11 Pro into a lightweight gaming OS.

It removes preinstalled apps, turns off telemetry and unneeded services, applies gaming performance settings and installs the TGOS Toolbox. Windows Defender stays on.

TGOS menghapus aplikasi bawaan, mematikan telemetri, dan menerapkan pengaturan performa.]]></Description>
	<Details>Removes preinstalled apps, turns off telemetry and unneeded services, and applies gaming performance settings.</Details>
	<ProgressText><![CDATA[TGOS is creating a restore point, removing preinstalled apps, and applying privacy, service and performance settings.]]></ProgressText>
	<Version>0.9.0</Version>
	<UniqueId>26dd6cef-05e4-4674-a9d5-d0460896ba6a</UniqueId>
	<SupportedBuilds>
		<!-- Windows 11 22H2 -->
		<string>22621</string>
		<!-- Windows 11 23H2 -->
		<string>22631</string>
		<!-- Windows 11 24H2 -->
		<string>26100</string>
		<!-- Windows 11 25H2 -->
		<string>26200</string>
		<!-- Windows 11 26H2 -->
		<string>26300</string>
	</SupportedBuilds>
	<Requirements>
		<Requirement>PluggedIn</Requirement>
		<Requirement>NoPendingUpdates</Requirement>
		<Requirement>NoAntivirus</Requirement>
	</Requirements>
	<Overhaul>true</Overhaul>
	<UseKernelDriver>false</UseKernelDriver>
	<EstimatedMinutes>10</EstimatedMinutes>
	<Website>https://tgopremium.my.id</Website>
	<FeaturePages>
		<CheckboxPage Description="Choose which built-in components TGOS removes.">
			<Options>
				<CheckboxOption IsChecked="true">
					<Text>Remove Copilot and Widgets</Text>
					<Name>remove-ai-widgets</Name>
				</CheckboxOption>
				<CheckboxOption IsChecked="true">
					<Text>Remove OneDrive</Text>
					<Name>remove-onedrive</Name>
				</CheckboxOption>
				<CheckboxOption IsChecked="false">
					<Text>Remove Xbox app and Game Bar</Text>
					<Name>remove-xbox</Name>
				</CheckboxOption>
				<CheckboxOption IsChecked="false">
					<Text>Remove Microsoft Edge (experimental)</Text>
					<Name>remove-edge</Name>
				</CheckboxOption>
			</Options>
		</CheckboxPage>
		<CheckboxPage Description="Performance options. Each one can be reversed later from the TGOS Toolbox. On a laptop, uncheck the power plan option to keep battery saving.">
			<Options>
				<CheckboxOption IsChecked="true">
					<Text>Ultimate Performance power plan</Text>
					<Name>disable-power-saving</Name>
				</CheckboxOption>
				<CheckboxOption IsChecked="true">
					<Text>Disable hibernation and Fast Startup</Text>
					<Name>disable-hibernation</Name>
				</CheckboxOption>
				<CheckboxOption IsChecked="true">
					<Text>Disable Core Isolation (VBS)</Text>
					<Name>disable-vbs</Name>
				</CheckboxOption>
				<CheckboxOption IsChecked="true">
					<Text>Disable search indexing</Text>
					<Name>disable-indexing</Name>
				</CheckboxOption>
			</Options>
		</CheckboxPage>
		<RadioPage IsRequired="true" DefaultOption="mitigations-default" Description="CPU mitigations protect against Spectre and Meltdown. Disabling them mostly helps older CPUs and reduces security.">
			<Options>
				<RadioOption>
					<Text>Keep Windows default mitigations (recommended)</Text>
					<Name>mitigations-default</Name>
				</RadioOption>
				<RadioOption>
					<Text>Disable CPU mitigations</Text>
					<Name>mitigations-disable</Name>
				</RadioOption>
			</Options>
		</RadioPage>
		<RadioPage IsRequired="true" DefaultOption="updates-manual" Description="With manual updates Windows only updates when you check in Settings. Security patches wait until you install them.">
			<Options>
				<RadioOption>
					<Text>Manual Windows updates</Text>
					<Name>updates-manual</Name>
				</RadioOption>
				<RadioOption>
					<Text>Automatic Windows updates (Windows default)</Text>
					<Name>updates-default</Name>
				</RadioOption>
			</Options>
		</RadioPage>
	</FeaturePages>
</Playbook>
