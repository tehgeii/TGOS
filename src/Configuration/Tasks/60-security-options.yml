---
title: Security options
description: Pengurangan fitur keamanan demi performa. Hanya bila opsinya dipilih.
actions:
  # Semua aksi di file ini bersyarat opsi dan punya pasangan pembalik di TGOS Toolbox.
  # Windows Defender TIDAK disentuh playbook; hanya bisa diubah lewat TGOS Toolbox
  # setelah instalasi. Firewall, UAC, Secure Boot, dan TPM tidak pernah disentuh.

  # --- Opsi: Virtualization-Based Security -----------------------------------------
  # VBS dan Memory Integrity (HVCI) menjalankan sebagian kernel di dalam hypervisor.
  # Mematikannya mengurangi proteksi kernel dan memberi kenaikan performa di banyak
  # sistem. Berlaku setelah restart.
  - !registryValue: { path: 'HKLM\SYSTEM\CurrentControlSet\Control\DeviceGuard', value: 'EnableVirtualizationBasedSecurity', data: '0', type: REG_DWORD, option: 'disable-vbs' }
  - !registryValue: { path: 'HKLM\SYSTEM\CurrentControlSet\Control\DeviceGuard\Scenarios\HypervisorEnforcedCodeIntegrity', value: 'Enabled', data: '0', type: REG_DWORD, option: 'disable-vbs' }

  # --- Opsi: mitigasi CPU ----------------------------------------------------------
  # Mematikan mitigasi Spectre dan Meltdown. Sistem menjadi rentan terhadap serangan
  # itu. Manfaat performanya terutama di CPU lama; di CPU baru bisa nol atau negatif.
  - !registryValue: { path: 'HKLM\SYSTEM\CurrentControlSet\Control\Session Manager\Memory Management', value: 'FeatureSettingsOverride', data: '3', type: REG_DWORD, option: 'mitigations-disable' }
  - !registryValue: { path: 'HKLM\SYSTEM\CurrentControlSet\Control\Session Manager\Memory Management', value: 'FeatureSettingsOverrideMask', data: '3', type: REG_DWORD, option: 'mitigations-disable' }

  # --- Opsi: update otomatis -------------------------------------------------------
  # Windows tidak mengunduh atau memasang update sendiri. Update tetap bisa dipasang
  # manual lewat Settings > Windows Update. Patch keamanan tertunda sampai dipasang.
  - !registryValue: { path: 'HKLM\SOFTWARE\Policies\Microsoft\Windows\WindowsUpdate\AU', value: 'NoAutoUpdate', data: '1', type: REG_DWORD, option: 'updates-manual' }

  # --- Opsi: pause update (bawaan) -------------------------------------------------
  # Windows Update ditahan lewat fitur pause bawaan Settings, sampai pengguna menekan
  # "Resume updates" di Settings > Windows Update (atau "Windows Updates - Resume" di
  # TGOS Toolbox). Nilai pause ditulis Set-TgosFeature.ps1, karena tanggalnya dihitung
  # saat instalasi: batas pause dinaikkan ke 3650 hari dan update ditahan 10 tahun.
  # Nilai-nilai itu tidak didokumentasikan resmi Microsoft (dipakai halaman Settings
  # sendiri), jadi sebagai cadangan update otomatis juga dimatikan: bila Windows
  # mengabaikan pause, hasilnya tetap seperti pilihan Manual. Setelah Resume, update
  # dipasang saat pengguna mengklik "Check for updates".
  - !registryValue: { path: 'HKLM\SOFTWARE\Policies\Microsoft\Windows\WindowsUpdate\AU', value: 'NoAutoUpdate', data: '1', type: REG_DWORD, option: 'updates-pause' }
  - !run:
    exe: '%SystemRoot%\System32\WindowsPowerShell\v1.0\powershell.exe'
    args: '-NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File ".\TGOS Toolbox\Support\Set-TgosFeature.ps1" -Feature UpdatePause -State Off'
    runas: trustedInstaller
    exeDir: true
    wait: true
    weight: 1
    showOutput: true
    showError: true
    option: 'updates-pause'

  # --- Opsi: update driver dari Windows Update -------------------------------------
  # Policy resmi "Do not include drivers with Windows Updates": Windows Update tidak
  # mengganti driver (mis. driver GPU NVIDIA/AMD yang dipasang sendiri). Driver untuk
  # perangkat baru tetap bisa dipasang manual.
  - !registryValue: { path: 'HKLM\SOFTWARE\Policies\Microsoft\Windows\WindowsUpdate', value: 'ExcludeWUDriversInQualityUpdate', data: '1', type: REG_DWORD, option: 'block-driver-updates' }
