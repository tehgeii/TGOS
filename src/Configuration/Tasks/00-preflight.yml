---
title: Preflight
description: Memastikan sistem adalah target TGOS, lalu membuat restore point.
actions:
  # AME Wizard hanya memeriksa nomor build (SupportedBuilds), tidak memeriksa edisi.
  # Skrip ini keluar dengan kode bukan 0 bila edisi bukan Pro, build terlalu lama,
  # atau arsitektur bukan x64. Kode bukan 0 menghentikan seluruh playbook.
  - !run:
    exe: '%SystemRoot%\System32\WindowsPowerShell\v1.0\powershell.exe'
    args: '-NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File ".\Scripts\Test-Compatibility.ps1"'
    runas: trustedInstaller
    exeDir: true
    wait: true
    weight: 1
    showOutput: true
    showError: true
    handleExitCodes: { "!0": halt }

  # Informasi saja (tidak menghentikan playbook): koneksi internet untuk unduhan
  # software pilihan, dan ruang disk kosong.
  - !run:
    exe: '%SystemRoot%\System32\WindowsPowerShell\v1.0\powershell.exe'
    args: '-NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File ".\Scripts\Test-Prerequisites.ps1"'
    runas: trustedInstaller
    exeDir: true
    wait: true
    weight: 1
    showOutput: true
    showError: true

  # Restore point "Before TGOS <versi>" sebagai jaring pengaman untuk perubahan
  # registry. Tidak fatal: skrip selalu keluar 0 dan mencatat hasilnya di
  # %ProgramData%\TGOS\restore-point.txt, yang lalu disalin ke install-info.txt.
  - !run:
    exe: '%SystemRoot%\System32\WindowsPowerShell\v1.0\powershell.exe'
    args: '-NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File ".\Scripts\New-RestorePoint.ps1"'
    runas: trustedInstaller
    exeDir: true
    wait: true
    weight: 10
    showOutput: true
    showError: true

  # Terminal bawaan sementara Windows Console Host (dikembalikan di 90-finalize). Di
  # Windows 11 dengan Windows Terminal sebagai terminal bawaan, konsol tersembunyi yang
  # dibuka program lain selama instalasi bisa tampil sebagai jendela kosong (uji VM revisi
  # kedua 1.0.0). Dijalankan sesudah restore point, supaya restore point memuat nilai asli.
  - !run:
    exe: '%SystemRoot%\System32\WindowsPowerShell\v1.0\powershell.exe'
    args: '-NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File ".\Scripts\Set-ConsoleHost.ps1" -Action Save'
    runas: trustedInstaller
    exeDir: true
    wait: true
    weight: 1
    showOutput: true
    showError: true
