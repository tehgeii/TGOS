    showError: true
    option: 'install-7zip'

  # --- Opsi: runtime game ----------------------------------------------------------
  # Visual C++ 2015-2022 (x64 dan x86), Visual C++ 2005-2013 (versi terakhir tiap
  # generasi, x86 dan x64), XNA Framework 4.0, dan pustaka DirectX lama (Juni 2010) yang
  # masih dibutuhkan banyak game dan launcher.
  - !run:
    exe: '%SystemRoot%\System32\WindowsPowerShell\v1.0\powershell.exe'
    args: '-NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File ".\Scripts\Install-Software.ps1" -Item vcredist'
    runas: trustedInstaller
    exeDir: true
    wait: true
    weight: 15
    showOutput: true
    showError: true
    option: 'install-runtimes'
  - !run:
    exe: '%SystemRoot%\System32\WindowsPowerShell\v1.0\powershell.exe'
    args: '-NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File ".\Scripts\Install-Software.ps1" -Item vcredist-legacy'
    runas: trustedInstaller
    exeDir: true
    wait: true
    weight: 20
    showOutput: true
    showError: true
    option: 'install-runtimes'
  - !run:
    exe: '%SystemRoot%\System32\WindowsPowerShell\v1.0\powershell.exe'
    args: '-NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File ".\Scripts\Install-Software.ps1" -Item xna'
    runas: trustedInstaller
    exeDir: true
    wait: true
    weight: 5
    showOutput: true
    showError: true
    option: 'install-runtimes'
  - !run:
    exe: '%SystemRoot%\System32\WindowsPowerShell\v1.0\powershell.exe'
    args: '-NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File ".\Scripts\Install-Software.ps1" -Item directx'
    runas: trustedInstaller
    exeDir: true
    wait: true
    weight: 15
    showOutput: true
    showError: true
    option: 'install-runtimes'

  # --- Opsi: .NET ------------------------------------------------------------------
  # .NET Framework 3.5 (fitur Windows; DISM mengunduhnya dari Windows Update, jadi
  # dijalankan di sini, sebelum update di-pause) dan .NET Desktop Runtime LTS terbaru,
  # x64 dan x86. Banyak game lama, mod, dan tool membutuhkannya.
  - !run:
    exe: '%SystemRoot%\System32\WindowsPowerShell\v1.0\powershell.exe'
    args: '-NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File ".\Scripts\Install-Software.ps1" -Item netfx3'
