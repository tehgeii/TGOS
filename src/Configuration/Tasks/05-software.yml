  # --- Opsi: aplikasi per pengguna -------------------------------------------------
  # Installer Discord dan Spotify memasang ke profil pengguna, jadi dijalankan sebagai
  # pengguna yang login (bukan TrustedInstaller, yang akan memasangnya ke profil sistem
  # yang tak terlihat). Jendela aplikasi yang dibuka installer ditutup otomatis.
  - !run:
    exe: '%SystemRoot%\System32\WindowsPowerShell\v1.0\powershell.exe'
    args: '-NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File ".\Scripts\Install-Software.ps1" -Item discord'
    runas: currentUser
    exeDir: true
    wait: true
    weight: 15
    showOutput: true
    showError: true
    option: 'install-discord'
  - !run:
    exe: '%SystemRoot%\System32\WindowsPowerShell\v1.0\powershell.exe'
    args: '-NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File ".\Scripts\Install-Software.ps1" -Item spotify'
    runas: currentUser
    exeDir: true
    wait: true
    weight: 15
    showOutput: true
    showError: true
    option: 'install-spotify'
