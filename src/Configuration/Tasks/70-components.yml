---
title: Components
description: Menghapus OneDrive dan Microsoft Edge. Hanya bila opsinya dipilih.
actions:
  # --- Opsi: OneDrive --------------------------------------------------------------
  # OneDrive terpasang per pengguna, jadi uninstaller resminya dijalankan sebagai
  # pengguna yang sedang login, dengan token yang sudah ter-elevasi: uninstaller itu
  # meminta hak admin, dan tanpa elevasi Windows menampilkan prompt UAC di tengah
  # instalasi. Tidak fatal: hasilnya diperiksa di laporan verifikasi.
  - !run:
    exe: '%SystemRoot%\System32\WindowsPowerShell\v1.0\powershell.exe'
    args: '-NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File ".\Scripts\Remove-OneDrive.ps1"'
    runas: currentUserElevated
    exeDir: true
    wait: true
    weight: 10
    showOutput: true
    showError: true
    option: 'remove-onedrive'
  # Mencegah OneDrive dipakai atau dipasang lagi untuk sinkronisasi file.
  - !registryValue: { path: 'HKLM\SOFTWARE\Policies\Microsoft\Windows\OneDrive', value: 'DisableFileSyncNGSC', data: '1', type: REG_DWORD, option: 'remove-onedrive' }
  # Pengguna baru tidak mendapat pemasangan OneDrive otomatis saat login pertama.
  - !registryValue: { path: 'HKCU\SOFTWARE\Microsoft\Windows\CurrentVersion\Run', value: 'OneDriveSetup', operation: delete, option: 'remove-onedrive' }

  # --- Opsi: Microsoft Edge --------------------------------------------------------
  # Memakai uninstaller milik Edge sendiri. WebView2 Runtime TIDAK dihapus karena
  # banyak launcher dan aplikasi bergantung padanya. Di Windows 11 Pro 26H2 Microsoft
  # menolak uninstall biasa (kode 93); cara pertama skrip ini berhasil di uji TGOS 0.9.1.
  # Update Windows bisa memasang Edge kembali. Hasilnya diperiksa di laporan verifikasi.
  # Tidak fatal.
  #
  # Pengaman: bila pengguna memilih browser di Wizard tetapi browser itu tidak terpasang
  # (mis. unduhan gagal), skrip TIDAK menghapus Edge.
  - !run:
    exe: '%SystemRoot%\System32\WindowsPowerShell\v1.0\powershell.exe'
    args: '-NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File ".\Scripts\Remove-Edge.ps1"'
    runas: trustedInstaller
    exeDir: true
    wait: true
    weight: 15
    showOutput: true
    showError: true
    option: 'remove-edge'
  # Edge Update tidak memasang Edge lagi. GUID di bawah adalah ID produk Edge Stable.
  - !registryValue: { path: 'HKLM\SOFTWARE\Policies\Microsoft\EdgeUpdate', value: 'Install{56EB18F8-B008-4CBD-B6D2-8C97FE7E9062}', data: '0', type: REG_DWORD, option: 'remove-edge' }
